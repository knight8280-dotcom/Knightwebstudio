<!doctype html><meta charset="utf-8"><title>lab2</title>
<style>
body{margin:0;font:14px sans-serif;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
.s{position:relative;height:280px;background:#eee;font-size:120px;overflow:hidden}
.h{position:absolute;left:50%;top:50%;--g:20deg}
.c{position:absolute;bottom:0;left:-.18em;width:.36em;height:.26em;background:#fc8;border:1px solid #333;transform-origin:bottom}
.A .c{transform:perspective(336px) translateZ(-120px) rotateX(-32deg) rotateY(calc(var(--a) + var(--g))) translateZ(120px) rotateY(32deg)}
.B .c{transform:perspective(2.8em) translateZ(-1em) rotateX(-32deg) rotateY(calc(var(--a) + var(--g))) translateZ(1em) rotateY(32deg)}
.C .c{transform:perspective(calc(var(--R)*2.8)) translateZ(calc(var(--R)*-1)) rotateX(-32deg) rotateY(calc(var(--a) + var(--g))) translateZ(var(--R)) rotateY(32deg)}
.D{perspective:336px}
.D .h{transform-style:preserve-3d}
.D .c{transform:translateZ(-120px) rotateX(-32deg) rotateY(calc(var(--a) + var(--g))) translateZ(120px) rotateY(32deg)}
.E{perspective:336px}
.E .c{left:calc(50% - .18em);top:calc(50% - .26em);bottom:auto;transform:translateZ(-120px) rotateX(-32deg) rotateY(calc(var(--a) + var(--g))) translateZ(120px) rotateY(32deg)}
p{position:absolute;margin:4px;font-size:12px;z-index:9}
</style>
<body>
<script>
const V = [['A px function', 'A'], ['B em function', 'B'], ['C calc var function', 'C'], ['D perspective property + preserve-3d hub', 'D'], ['E perspective property, direct children', 'E']];
V.forEach(([name, s]) => {
  const S = document.createElement('div'); S.className = 's ' + s; S.style.setProperty('--R', '120px'); S.innerHTML = '<p>' + name + '</p>';
  const Hb = s === 'E' ? S : document.createElement('div'); if (s !== 'E') Hb.className = 'h'; else S.style.setProperty('--g', '20deg');
  for (let i = 0; i < 24; i++) { const e = document.createElement('div'); e.className = 'c'; e.style.cssText = '--a:' + i * 15 + 'deg;z-index:' + Math.round(100 * Math.cos((i * 15 + 20) * Math.PI / 180)); Hb.append(e); }
  if (s !== 'E') S.append(Hb); document.body.append(S);
});
</script>
