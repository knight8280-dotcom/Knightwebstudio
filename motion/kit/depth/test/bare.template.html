<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kit on a bare page: no site stylesheet, no site script</title>
<!-- The one line a client page puts in its head: it holds each carousel's space until its script runs, for at most four seconds -->
<script>document.documentElement.classList.add('kws-hold'); setTimeout(function () { document.documentElement.classList.remove('kws-hold'); }, 4000);</script>
<link rel="stylesheet" href="../cylinder.css">
<link rel="stylesheet" href="../ring.css">
<style>
/* Everything a client site would supply: a small reset (as a utility framework's base layer does), fonts, and the kit variables. */
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, p { margin: 0; font-size: inherit; font-weight: inherit; }
body { margin: 0; background: #FBF4E9; color: #4B3B33; font: 16px/1.6 "Avenir Next", "Segoe UI", system-ui, sans-serif; overflow-x: clip; }
:root {
  --kit-bg: #FBF4E9; --kit-surface: #FFFFFF; --kit-ink: #2B1D17; --kit-muted: #5E4B42; --kit-line: #D9C7B3;
  --kit-accent: #7A2E1D; --kit-accent-ink: #FFF6E6; --kit-notice: #A2542A; --kit-gilt: #E9B872;
  --kit-radius: 18px; --kit-font-display: "Rockwell", "Roboto Slab", "Georgia", serif; --kit-font-body: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --kit-shadow: 0 1px 0 rgba(43, 29, 23, .25), 0 14px 26px -16px rgba(43, 29, 23, .55);
  --kws-bleed: 20px; /* this page's side padding: how far the ring may run past its column */
}
main { padding: 48px 0 96px; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
h1 { margin-bottom: 40px; color: var(--kit-ink); font: 700 clamp(2rem, 6vw, 3.25rem)/1.05 var(--kit-font-display); }
h2 { margin: 72px 0 32px; color: var(--kit-ink); font: 700 clamp(1.6rem, 4vw, 2.25rem)/1.1 var(--kit-font-display); }
/* The client's own pictures go in the art slot; here, plain placeholders */
.pic { width: 100%; height: 9rem; border-radius: 10px; background: repeating-linear-gradient(135deg, #F3E6D4 0 12px, #FBF4E9 12px 24px); }
.kws-cyl-card a { color: var(--kit-accent); font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="wrap"><h1>The kit on a bare page</h1></div>
<!--CYL-->
  <div class="wrap">
  <h2>The card file</h2>
<!--RING-->
  </div>
</main>
<script src="../cylinder.js" defer></script>
<script src="../ring.js" defer></script>
</body>
</html>
