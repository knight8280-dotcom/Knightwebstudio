<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — KnightWebstudio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<script>
  (function () {
    var d = document.documentElement; d.classList.add('js');
    // The header crest builds itself on the first page of a visit only
    try { if (!sessionStorage.getItem('kws-crest')) { d.classList.add('crest-intro'); sessionStorage.setItem('kws-crest', '1'); } } catch (e) {}
    try {
      var t = localStorage.getItem('theme');
      if (!t && matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
      if (t) d.setAttribute('data-theme', t);
    } catch (e) { /* private mode */ }
  })();
</script>
<link rel="preload" href="/assets/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  .nf { min-height: 100svh; display: grid; place-items: center; text-align: center; position: relative; }
  .nf-code {
    font-family: var(--font-display);
    font-size: clamp(4.5rem, 16vw, 9rem); font-weight: 700; line-height: 1;
    letter-spacing: -.05em; color: var(--brand); margin: 0;
  }
  .nf h1 { margin-top: .1em; }
  .nf p { color: var(--muted); max-width: 34em; margin-inline: auto; }
  .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 1.6rem; }
  .nf-brand { display: inline-flex; align-items: center; gap: .55rem; margin-bottom: 2rem;
              font-family: var(--font-display); font-weight: 650; letter-spacing: -.025em; }
  .nf-brand .crest { width: 40px; height: 40px; }
  /* The knight has toppled: this page has moved on */
  .nf-art { width: 120px; aspect-ratio: 1; margin: 0 auto 6px; }
  .nf-art .piece { transform: translate(8px, 16px) rotate(78deg); }
  .js .nf-art .piece { animation: topple 1s cubic-bezier(.5, 0, .4, 1.3) .5s both; }
  @keyframes topple { from { transform: none } 60% { transform: translate(8px, 16px) rotate(84deg) } to { transform: translate(8px, 16px) rotate(78deg) } }
  @media (prefers-reduced-motion: reduce) { .js .nf-art .piece { animation: none; } }
</style>
</head>
<body>
<main class="nf">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="container">
    <a class="nf-brand" href="/">
      <!-- art:crest-header --><!-- /art:crest-header -->
      KnightWebstudio
    </a>
    <div class="nf-art"><!-- art:piece-knight --><!-- /art:piece-knight --></div>
    <p class="nf-code">404</p>
    <h1>This page has moved on</h1>
    <p>The link is broken or the page no longer exists. Head back to the homepage, or tell us what you were looking for and we'll point you at it.</p>
    <div class="nf-actions">
      <a class="btn btn-primary" href="/">Back to homepage</a>
      <a class="btn btn-ghost" href="/contact/">Get in touch</a>
    </div>
  </div>
</main>
</body>
</html>
